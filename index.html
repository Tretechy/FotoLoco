<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FotoLoco</title>
<meta name="description" content="Foto-Locations finden, teilen und planen – mit Licht-Planer für Sonne, goldene und blaue Stunde und Milchstraße.">
<meta name="theme-color" content="#C2601A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FotoLoco">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map" role="region" aria-label="Karte"></div>

<div class="top">
  <div class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="4.5" fill="var(--gold)"/><path d="M2 17h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 3v3M4.9 6.4l2 2M19.1 6.4l-2 2" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/></svg><span class="name">FotoLoco</span></div>
    <div class="search">
      <input id="q" type="search" placeholder="Ort, Adresse oder Spot suchen" autocomplete="off" enterkeyhint="search" aria-label="Ort, Adresse oder Spot suchen">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="iconbtn" id="layerBtn" type="button" aria-pressed="false" title="Satellitenbild ein/aus"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg><span class="lbl" id="layerLbl">Satellit</span></button>
    <button class="iconbtn" id="locBtn" type="button" title="Mein Standort" aria-label="Mein Standort"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <nav class="chips" id="chips" aria-label="Nach Kategorie filtern"></nav>
</div>

<div class="banner" id="banner" role="status" hidden></div>
<div class="pickbar" id="pickbar" hidden><span>Tippe auf die Karte, wo der Spot liegt</span><button class="btn" id="pickCancel" type="button">Abbrechen</button></div>

<section class="sheet" id="sheet" aria-label="Details">
  <button class="handle" id="handle" type="button" aria-label="Info-Karte vergrößern oder verkleinern"><span></span></button>
  <div class="sheet-body" id="panel"></div>
</section>
<button class="fab" id="addBtn" type="button">+ Spot</button>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/suncalc.js"></script>
<script src="vendor/tz-lookup.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
